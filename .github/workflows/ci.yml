name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Test the built wheel, not the source tree, so packaging mistakes fail CI
      - name: Install wheel
        shell: bash
        run: pip install "$(ls dist/*.whl)" pytest anyio

      # A fake model server stands in for Ollama and OpenAI-compatible APIs
      - name: Test
        run: pytest -q

      - name: Smoke test the entry points
        shell: bash
        run: |
          evalpair --version
          python -m evalpair --version
          evalpair --help
