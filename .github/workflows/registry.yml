name: MCP registry

# Runs after a successful Publish (a v* tag reached PyPI), or by hand for a version already on PyPI.
on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag whose server.json to publish, e.g. v0.1.0"
        required: true

env:
  PUBLISHER_VERSION: v1.8.1
  PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha }}
      - name: Check server.json matches the package version
        run: |
          project=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python3 - "$project" <<'EOF'
          import json, sys
          s = json.load(open("server.json"))
          versions = {s["version"], *(p["version"] for p in s["packages"])}
          if versions != {sys.argv[1]}:
              sys.exit(f"server.json versions {sorted(versions)} do not match pyproject {sys.argv[1]}")
          EOF
      - name: Install mcp-publisher
        run: |
          curl -fsSLo publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  publisher.tar.gz" | sha256sum -c -
          tar xzf publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
